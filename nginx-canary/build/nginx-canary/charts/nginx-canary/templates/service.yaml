apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.basic.component }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.basic.component }}
spec:
  type: NodePort
  selector:
    # app-only：不同版本的 pod 都带 app 标签，本 Service 能同时选中
    # （多版本并存时流量按 pod 副本比例自然分布）。
    app: {{ .Values.basic.component }}
  ports:
    - name: http
      port: {{ .Values.service.externPort }}
      targetPort: {{ .Values.service.containerPort }}
