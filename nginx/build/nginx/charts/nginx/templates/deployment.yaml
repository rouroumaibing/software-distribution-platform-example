apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.basic.component }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.basic.component }}
    version: v1
spec:
  replicas: {{ .Values.basic.replicaCount }}
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: {{ .Values.basic.component }}
      version: v1
  template:
    metadata:
      labels:
        app: {{ .Values.basic.component }}
        version: v1
    spec:
      containers:
        - name: container-1
          image: {{ .Values.image.imageAddr }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          resources:
            requests:
              cpu: {{ .Values.resources.resources_cpu_requests }}
              memory: {{ .Values.resources.resources_mem_requests }}
            limits:
              cpu: {{ .Values.resources.resources_cpu_limits }}
              memory: {{ .Values.resources.resources_mem_limits }}
          ports:
            - name: http
              containerPort: {{ .Values.service.containerPort }}
              protocol: TCP
          # 根路径健康检查：保证访问页面前 Pod 已就绪。
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  progressDeadlineSeconds: 600
